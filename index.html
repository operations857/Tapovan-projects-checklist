<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#23272A;
  --orange:#E85D2C;
  --orange-dim:#F3A181;
  --blue:#2F5D8A;
  --concrete:#EFECE5;
  --paper:#FFFFFF;
  --rebar:#8B8D89;
  --border:#DCD7CC;
  --green:#4E9A5D;
  --yellow:#D99B23;
  --radius:10px;
}
*{box-sizing:border-box;}
#scw{
  font-family:'Inter',sans-serif;
  background:var(--concrete);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  max-width:560px;
  margin:0 auto;
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
}
#scw .disp{font-family:'Barlow Condensed',sans-serif; font-weight:800; letter-spacing:0.02em;}
#scw .eyebrow{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; font-size:11px; color:var(--rebar);}

/* header */
#scw .topbar{
  padding:18px 16px 10px;
  background:var(--paper);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:5;
}
#scw .crumbs{display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-bottom:6px; min-height:14px;}
#scw .crumb{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; font-size:11px; color:var(--rebar); cursor:pointer; border:none; background:none; padding:0;}
#scw .crumb:hover{color:var(--orange);}
#scw .crumb-sep{color:var(--border); font-size:11px;}
#scw .titlerow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
#scw h1{font-size:26px; margin:0; line-height:1;}
#scw .addbtn{
  width:38px; height:38px; border-radius:50%; background:var(--orange); color:#fff; border:none;
  font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(232,93,44,0.4); flex-shrink:0;
}
#scw .addbtn:active{transform:scale(0.94);}
#scw .searchrow{margin-top:10px; position:relative;}
#scw .searchrow input{
  width:100%; padding:9px 12px 9px 32px; border-radius:8px; border:1px solid var(--border);
  background:var(--concrete); font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink);
}
#scw .searchrow svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--rebar);}

/* progress bar - measuring-tape style */
#scw .tape{height:8px; border-radius:4px; background:repeating-linear-gradient(90deg,var(--border) 0 1px, transparent 1px 8px), var(--border); position:relative; overflow:hidden;}
#scw .tape-fill{height:100%; background:linear-gradient(90deg,var(--orange),#F08050); border-radius:4px 0 0 4px; transition:width .3s ease;}
#scw .pct{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; color:var(--rebar); min-width:34px; text-align:right;}

/* list body */
#scw .body{flex:1; overflow-y:auto; padding:12px 14px 90px;}
#scw .card{
  background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
  padding:13px 14px; margin-bottom:9px; cursor:pointer; transition:border-color .15s;
}
#scw .card:hover{border-color:var(--orange-dim);}
#scw .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
#scw .card-name{font-weight:600; font-size:15px;}
#scw .card-code{font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--rebar); letter-spacing:0.04em; margin-top:1px;}
#scw .card-progress{display:flex; align-items:center; gap:8px; margin-top:10px;}
#scw .kebab{background:none;border:none;color:var(--rebar);font-size:18px;cursor:pointer;padding:2px 6px;flex-shrink:0;}
#scw .kebab:hover{color:var(--orange);}

#scw .empty{
  text-align:center; padding:60px 20px; color:var(--rebar);
}
#scw .empty .disp{font-size:19px; color:var(--ink); margin-bottom:6px;}
#scw .empty button{
  margin-top:14px; background:var(--orange); color:#fff; border:none; padding:10px 20px;
  border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
  cursor:pointer; font-size:13px;
}

/* add form panel */
#scw .panel{
  background:var(--paper); border:1px solid var(--orange-dim); border-radius:var(--radius);
  padding:14px; margin-bottom:14px;
}
#scw .panel .eyebrow{color:var(--orange); margin-bottom:8px; display:block;}
#scw .field{margin-bottom:10px;}
#scw .field label{display:block; font-size:11.5px; font-weight:600; color:var(--rebar); margin-bottom:4px;}
#scw .field input, #scw .field select{
  width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--border); font-family:'Inter',sans-serif; font-size:13.5px; background:var(--concrete);
}
#scw .chiprow{display:flex; gap:6px; flex-wrap:wrap;}
#scw .chip{
  border:1px solid var(--border); background:var(--concrete); padding:6px 12px; border-radius:20px;
  font-size:12.5px; cursor:pointer; font-weight:500;
}
#scw .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
#scw .panel-actions{display:flex; gap:8px; margin-top:12px;}
#scw .btn-primary{background:var(--orange); color:#fff; border:none; padding:9px 16px; border-radius:7px; font-weight:600; font-size:13.5px; cursor:pointer;}
#scw .btn-ghost{background:none; border:1px solid var(--border); padding:9px 16px; border-radius:7px; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--rebar);}
#scw .checkline{display:flex; align-items:center; gap:8px; font-size:13px; margin-top:2px;}

/* work items */
#scw .item-row{display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px;}
#scw .stamp{
  width:30px; height:30px; border-radius:6px; border:2px dashed var(--rebar); background:none; flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:transform .15s;
}
#scw .stamp svg{width:16px; height:16px; opacity:0;}
#scw .stamp.pending{border-color:var(--border);}
#scw .stamp.progress{border-style:solid; border-color:var(--yellow);}
#scw .stamp.done{border-style:solid; border-color:var(--green); background:var(--green); transform:rotate(-4deg);}
#scw .stamp.done svg{opacity:1; stroke:#fff;}
#scw .item-info{flex:1; min-width:0;}
#scw .item-name{font-weight:600; font-size:14px;}
#scw .item-name.done-text{text-decoration:line-through; color:var(--rebar);}
#scw .item-meta{display:flex; align-items:center; gap:8px; margin-top:4px;}
#scw .assignee-select{border:none; background:var(--concrete); font-size:11.5px; padding:3px 7px; border-radius:12px; color:var(--ink); font-weight:500;}
#scw .status-pill{font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:3px 9px; border-radius:10px; cursor:pointer; flex-shrink:0;}
#scw .status-pill.pending{background:var(--border); color:var(--rebar);}
#scw .status-pill.progress{background:#FBEBCE; color:var(--yellow);}
#scw .status-pill.done{background:#DCEEE0; color:var(--green);}
#scw .del{background:none; border:none; color:var(--rebar); font-size:16px; cursor:pointer; flex-shrink:0;}
#scw .del:hover{color:var(--orange);}
#scw .template-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
#scw .tbtn{white-space:nowrap; border:1px dashed var(--rebar); background:none; padding:7px 12px; border-radius:8px; font-size:12.5px; cursor:pointer; color:var(--ink);}
#scw .tbtn:hover{border-color:var(--orange); color:var(--orange);}

/* users */
#scw .user-row{display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--border); border-radius:var(--radius); padding:11px 13px; margin-bottom:8px;}
#scw .avatar{width:34px; height:34px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:700; flex-shrink:0;}
#scw .user-role{font-size:12px; color:var(--rebar);}

/* bottom nav */
#scw .navbar{
  position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--border);
  display:flex; z-index:5;
}
#scw .navbtn{
  flex:1; background:none; border:none; padding:9px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; color:var(--rebar); opacity:0.65;
}
#scw .navbtn.active{color:var(--orange); opacity:1;}
#scw .navbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8;}
#scw .navbtn span{font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;}
#scw .navbtn:disabled{opacity:0.3; cursor:not-allowed;}

#scw .who-badge{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
  font-size:11px; background:var(--concrete); border:1px solid var(--border); color:var(--ink);
  padding:8px 12px; border-radius:20px; cursor:pointer; white-space:nowrap;
}
#scw .who-badge:hover{border-color:var(--orange); color:var(--orange);}
#scw .activity-block{margin-top:18px; padding-top:14px; border-top:1px solid var(--border);}
#scw .report-icon-row{display:flex; gap:12px;}
#scw .report-icon-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:18px 10px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--paper); cursor:pointer;
}
#scw .report-icon-btn:hover{border-color:var(--orange);}
#scw .report-icon-btn svg{width:24px; height:24px; stroke:var(--orange); fill:none; stroke-width:1.8;}
#scw .report-icon-btn span{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink); text-align:center;}
#scw .pr-row{display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
#scw .pr-row:last-child{border-bottom:none;}
#scw .pr-project{font-weight:700; font-size:13.5px;}
#scw .pr-unit{padding-left:14px; font-size:12.5px; color:var(--ink);}
#scw .pr-room{padding-left:28px; font-size:12px; color:var(--rebar);}
#scw .pr-label{flex:1; min-width:40px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#scw .pr-sub{font-size:9.5px; color:var(--rebar); white-space:nowrap; flex-shrink:0;}
#scw .pr-bar{display:flex; align-items:center; gap:6px; flex:0 0 100px;}
#scw .pr-bar .pct{min-width:32px; font-size:11.5px;}
#scw .log-row-stack{padding:6px 0; border-bottom:1px solid var(--border); font-size:11.5px;}
#scw .log-row-stack:last-child{border-bottom:none;}
#scw .log-row-top{display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
#scw .log-row{display:flex; align-items:baseline; gap:6px; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
#scw .log-row:last-child{border-bottom:none;}
#scw .log-who{font-weight:700; color:var(--blue);}
#scw .log-action{color:var(--ink); flex:1;}
#scw .log-time{color:var(--rebar); font-size:11px; margin-left:auto;}
#scw .item-updated{font-size:10.5px; color:var(--rebar); margin-top:2px;}
#scw .item-actions{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
#scw .icon-btn{
  display:flex; align-items:center; gap:5px; background:var(--concrete); border:1px solid var(--border);
  border-radius:14px; padding:4px 10px; cursor:pointer; color:var(--rebar);
}
#scw .icon-btn svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; flex-shrink:0;}
#scw .icon-btn span{font-size:11px; font-weight:600; white-space:nowrap;}
#scw .icon-btn.active{background:var(--ink); border-color:var(--ink); color:#fff;}
#scw .icon-btn.snag-btn.has-snag{background:#FCE4DE; border-color:var(--orange); color:var(--orange);}
#scw .icon-btn.snag-btn.has-snag.active{background:var(--orange); border-color:var(--orange); color:#fff;}
#scw .thread-panel{
  background:var(--concrete); border:1px solid var(--border); border-top:none; border-radius:0 0 var(--radius) var(--radius);
  margin:-8px 0 8px; padding:10px 12px 12px;
}
#scw .thread-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
#scw .thread-entry{background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:6px;}
#scw .thread-entry.resolved{opacity:0.55;}
#scw .thread-entry-top{display:flex; justify-content:space-between; gap:8px; font-size:11.5px; margin-bottom:3px;}
#scw .thread-entry-text{font-size:13px; line-height:1.35;}
#scw .thread-resolve{margin-top:6px; font-size:10.5px; padding:4px 9px;}
#scw .thread-input-row{display:flex; gap:6px; margin-top:6px;}
#scw .thread-input{flex:1; padding:8px 10px; border-radius:7px; border:1px solid var(--border); background:var(--paper); font-family:'Inter',sans-serif; font-size:13px;}

#scw .loading{display:flex; align-items:center; justify-content:center; height:60vh; color:var(--rebar); font-family:'Barlow Condensed',sans-serif;}
#scw .toast{
  position:fixed; bottom:78px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:9px 16px; border-radius:8px; font-size:12.5px; z-index:20; opacity:0; transition:opacity .25s; pointer-events:none;
}
#scw .toast.show{opacity:1;}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<div id="scw"><div class="loading">Loading site data…</div></div>

<script>
(function(){
  const root = document.getElementById('scw');
  let saving = false;
  let docRef = null;

  // ↓↓↓ PASTE YOUR FIREBASE CONFIG HERE (see setup guide) ↓↓↓
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCM-QOK0pBUuyIMt9HKELTC259AAVGwxD0",
    authDomain: "tapovan-checklist.firebaseapp.com",
    projectId: "tapovan-checklist",
    storageBucket: "tapovan-checklist.firebasestorage.app",
    messagingSenderId: "241270667154",
    appId: "1:241270667154:web:6fef89ea386f4ce3df734b"
  };
  // ↑↑↑ from Firebase Console → Project settings → Your apps → Web app ↑↑↑

  // ↓↓↓ CHANGE THIS to whatever PIN you want to gate the reports with ↓↓↓
  const ADMIN_PIN = '1309';
  // ↑↑↑ share this only with people who should see the Activity report ↑↑↑

  const ROOM_TEMPLATES = {
    '1BHK': [['Foyer','FYR'],['Living Room','LR'],['Kitchen','KIT'],['Master Bedroom','MB'],['Bathroom','B1'],['Balcony','BAL'],['Utility','UTLY']],
    '2BHK': [['Foyer','FYR'],['Living Room','LR'],['Kitchen','KIT'],['Master Bedroom','MB'],['Bathroom 1','B1'],['Bedroom 2','BED2'],['Bathroom 2','B2'],['Balcony','BAL'],['Utility','UTLY']],
    '3BHK': [['Foyer','FYR'],['Living Room','LR'],['Kitchen','KIT'],['Master Bedroom','MB'],['Bathroom 1','B1'],['Bedroom 2','BED2'],['Bathroom 2','B2'],['Bedroom 3','BED3'],['Bathroom 3','B3'],['Balcony','BAL'],['Utility','UTLY']],
    'Custom': []
  };
  const ITEM_TEMPLATE = ['Flooring','Painting','Electrical Wiring','Plumbing','Fixtures & Fittings','Final Cleaning'];

  function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }

  function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function lsSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
  function lsRemove(key){ try{ localStorage.removeItem(key); }catch(e){} }

  function timeAgo(ts){
    const diff = Date.now()-ts;
    const mins = Math.floor(diff/60000);
    if(mins<1) return 'just now';
    if(mins<60) return mins+'m ago';
    const hrs = Math.floor(mins/60);
    if(hrs<24) return hrs+'h ago';
    return Math.floor(hrs/24)+'d ago';
  }

  let state = {
    data: { projects: [], units: [], rooms: [], items: [], users: [], log: [] },
    tab: 'projects',
    selProject: null, selUnit: null, selRoom: null,
    search: '', addOpen: null, formType: '2BHK',
    currentUser: lsGet('sc_user_name') || null,
    reportsUnlocked: lsGet('sc_reports_unlocked') === 'true',
    pinOpen: false,
    reportView: null,
    openThread: null
  };

  function esc(str){
    return String(str==null?'':str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function logActivity(action){
    const entry = { who: state.currentUser || 'Someone', action, ts: Date.now() };
    if(!state.data.log) state.data.log = [];
    state.data.log.unshift(entry);
    if(state.data.log.length > 200) state.data.log.length = 200;
  }

  const ICONS = {
    projects: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/>',
    units: '<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>',
    rooms: '<path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/>',
    items: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 9l2 2 4-4"/><path d="M7 16h6"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.8 14.3c2.4.2 4.2 2.3 4.2 4.7"/>',
    chart: '<path d="M4 19V5"/><rect x="7" y="10" width="3" height="9" rx="0.5"/><rect x="12" y="6" width="3" height="13" rx="0.5"/><rect x="17" y="13" width="3" height="6" rx="0.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    comment: '<path d="M21 11.5c0 4.14-3.8 7.5-8.5 7.5-1.1 0-2.15-.18-3.1-.51L4 20l1.2-3.6A7.1 7.1 0 014 11.5C4 7.36 7.8 4 12.5 4S21 7.36 21 11.5z"/>',
    flag: '<path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/>'
  };
  function icon(name){ return `<svg viewBox="0 0 24 24" fill="none">${ICONS[name]}</svg>`; }

  async function init(){
    if(FIREBASE_CONFIG.apiKey.includes('PASTE_YOUR')){
      root.innerHTML = `<div class="loading" style="flex-direction:column;gap:10px;padding:40px 30px;text-align:center;">
        <div>⚠️ Not connected to Firebase yet.</div>
        <div style="font-size:12px;">Open this file's code, find <code>FIREBASE_CONFIG</code> near the top of the &lt;script&gt; tag, and paste in your project's config values. See the setup guide for the copy-paste steps.</div>
      </div>`;
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      const db = firebase.firestore();
      docRef = db.collection('checklist').doc('main');
      docRef.onSnapshot((snap)=>{
        if(snap.exists){
          const remote = snap.data();
          if(remote && remote.projects) state.data = remote;
        }
        if(!state.data.log) state.data.log = [];
        render();
      }, (err)=>{ toast('Could not load data — check your Firebase setup'); });
    }catch(e){ toast('Could not connect to Firebase'); }
  }

  async function save(){
    if(!docRef) return;
    try{
      saving = true;
      await docRef.set(state.data);
    }catch(e){ toast('Could not save — check connection'); }
    finally{ saving = false; }
  }

  function toast(msg){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    root.appendChild(t);
    requestAnimationFrame(()=>t.classList.add('show'));
    setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 1600);
  }

  // ---------- derived helpers ----------
  function unitsOf(pid){ return state.data.units.filter(u=>u.projectId===pid); }
  function roomsOf(uid_){ return state.data.rooms.filter(r=>r.unitId===uid_); }
  function itemsOf(rid){ return state.data.items.filter(i=>i.roomId===rid); }

  function itemProgress(rid){
    const its = itemsOf(rid);
    if(!its.length) return 0;
    return Math.round(its.filter(i=>i.status==='done').length / its.length * 100);
  }
  function roomProgressAll(uid_){
    const rs = roomsOf(uid_);
    if(!rs.length) return 0;
    return Math.round(rs.reduce((a,r)=>a+itemProgress(r.id),0)/rs.length);
  }
  function unitProgressAll(pid){
    const us = unitsOf(pid);
    if(!us.length) return 0;
    return Math.round(us.reduce((a,u)=>a+roomProgressAll(u.id),0)/us.length);
  }
  function userName(id){ const u = state.data.users.find(x=>x.id===id); return u ? u.name : 'Unassigned'; }

  function tapeBar(pct){
    return `<div class="tape"><div class="tape-fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span>`;
  }

  // ---------- crumbs ----------
  function crumbs(){
    const p = state.data.projects.find(x=>x.id===state.selProject);
    const u = state.data.units.find(x=>x.id===state.selUnit);
    const r = state.data.rooms.find(x=>x.id===state.selRoom);
    let parts = [];
    if(state.tab!=='projects' && state.tab!=='users') parts.push(['All Projects', ()=>{state.tab='projects'; render();}]);
    if(p && (state.tab==='units'||state.tab==='rooms'||state.tab==='items')) parts.push([p.name, ()=>{state.tab='units'; render();}]);
    if(u && (state.tab==='rooms'||state.tab==='items')) parts.push([u.name, ()=>{state.tab='rooms'; render();}]);
    if(r && state.tab==='items') parts.push([r.name, null]);
    if(!parts.length) return '';
    return '<div class="crumbs">' + parts.map(([label,fn],i)=>{
      const sep = i>0 ? '<span class="crumb-sep">/</span>' : '';
      return sep + `<button class="crumb" data-crumb="${i}">${label}</button>`;
    }).join('') + '</div>';
  }

  // ---------- identity ----------
  function renderIdentityScreen(){
    const chips = state.data.users.length ? `<div class="chiprow" style="margin-top:10px;">${state.data.users.map(u=>`<button type="button" class="chip" data-pick-name="${u.name}">${u.name}</button>`).join('')}</div>` : '';
    root.innerHTML = `<div class="topbar"><div class="titlerow"><h1 class="disp">Who's this?</h1></div></div>
      <div class="body">
        <div class="panel">
          <span class="eyebrow">Enter your name</span>
          <div class="field"><input id="f_identity" placeholder="e.g. Ramesh Kumar"></div>
          ${chips}
          <div class="panel-actions"><button class="btn-primary" data-action="save-identity">Continue</button></div>
        </div>
        <div style="font-size:12px;color:var(--rebar);text-align:center;margin-top:6px;">This just tags your updates so the team can see who changed what. No password needed.</div>
      </div>`;
    const btn = root.querySelector('[data-action="save-identity"]');
    const input = root.querySelector('#f_identity');
    input.focus();
    btn.addEventListener('click', ()=>{
      const val = input.value.trim();
      if(!val) return toast('Enter your name');
      lsSet('sc_user_name', val);
      state.currentUser = val;
      render();
    });
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') btn.click(); });
    root.querySelectorAll('[data-pick-name]').forEach(c=>c.addEventListener('click', ()=>{ input.value = c.dataset.pickName; }));
  }

  // ---------- render dispatcher ----------
  function render(){
    if(!state.currentUser){ renderIdentityScreen(); return; }
    let html = `<div class="topbar">${crumbs()}${topRow()}${searchRow()}</div><div class="body">`;
    if(state.tab==='projects') html += renderProjects();
    else if(state.tab==='units') html += renderUnits();
    else if(state.tab==='rooms') html += renderRooms();
    else if(state.tab==='items') html += renderItems();
    else if(state.tab==='users') html += renderUsers();
    html += '</div>' + navbar();
    root.innerHTML = html;
    attachEvents();
  }

  function titleFor(){
    if(state.tab==='projects') return 'Projects';
    if(state.tab==='units') return 'Units';
    if(state.tab==='rooms') return 'Rooms';
    if(state.tab==='items') return 'Work Items';
    if(state.tab==='users') return 'Team';
  }
  function canAdd(){
    if(state.tab==='units') return !!state.selProject;
    if(state.tab==='rooms') return !!state.selUnit;
    if(state.tab==='items') return !!state.selRoom;
    return true;
  }
  function topRow(){
    return `<div class="titlerow"><h1 class="disp">${titleFor()}</h1><div style="display:flex;align-items:center;gap:8px;">
      <button class="who-badge" data-action="switch-identity" title="Switch who you are">${state.currentUser}</button>
      ${canAdd() ? `<button class="addbtn" data-action="toggle-add">+</button>` : ''}
    </div></div>`;
  }
  function searchRow(){
    if(state.addOpen) return '';
    return `<div class="searchrow">${icon('projects').replace('viewBox="0 0 24 24" fill="none"','viewBox="0 0 24 24"')}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input type="text" id="searchInput" placeholder="Search" value="${state.search}"></div>`;
  }

  function navbar(){
    const tabs = [['projects','Projects',true],['units','Units',!!state.selProject],['rooms','Rooms',!!state.selUnit],['items','Items',!!state.selRoom],['users','Users',true]];
    return '<div class="navbar">' + tabs.map(([id,label,enabled])=>{
      return `<button class="navbtn ${state.tab===id?'active':''}" data-nav="${id}" ${enabled?'':'disabled'}>${icon(id)}<span>${label}</span></button>`;
    }).join('') + '</div>';
  }

  // ---------- PROJECTS ----------
  function renderProjects(){
    let out = '';
    if(state.addOpen==='project') out += projectForm();
    const list = state.data.projects.filter(p=>p.name.toLowerCase().includes(state.search.toLowerCase()));
    if(!list.length && !state.addOpen) return out + emptyState('No projects yet','Add your first project to start tracking site progress.','project');
    out += list.map(p=>{
      const pct = unitProgressAll(p.id);
      return `<div class="card" data-select-project="${p.id}">
        <div class="card-top"><div><div class="card-name">${p.name}</div><div class="card-code">${p.code} · ${unitsOf(p.id).length} unit${unitsOf(p.id).length!==1?'s':''}</div></div>
        <button class="kebab" data-del="project:${p.id}">&times;</button></div>
        <div class="card-progress">${tapeBar(pct)}</div></div>`;
    }).join('');
    return out;
  }
  function projectForm(){
    return `<div class="panel"><span class="eyebrow">New Project</span>
      <div class="field"><label>Project name</label><input id="f_name" placeholder="e.g. Tranquil"></div>
      <div class="field"><label>Project code</label><input id="f_code" placeholder="e.g. P1"></div>
      ${panelActions('project')}</div>`;
  }

  // ---------- UNITS ----------
  function renderUnits(){
    if(!state.selProject) return emptyState('Select a project','Choose a project from the Projects tab to see its units.',null);
    let out = '';
    if(state.addOpen==='unit') out += unitForm();
    const list = unitsOf(state.selProject).filter(u=>u.name.toLowerCase().includes(state.search.toLowerCase()));
    if(!list.length && !state.addOpen) return out + emptyState('No units yet','Add a unit and pick a layout to auto-generate its rooms.','unit');
    out += list.map(u=>{
      const pct = roomProgressAll(u.id);
      return `<div class="card" data-select-unit="${u.id}">
        <div class="card-top"><div><div class="card-name">${u.name}</div><div class="card-code">${u.type} · ${roomsOf(u.id).length} room${roomsOf(u.id).length!==1?'s':''}</div></div>
        <button class="kebab" data-del="unit:${u.id}">&times;</button></div>
        <div class="card-progress">${tapeBar(pct)}</div></div>`;
    }).join('');
    return out;
  }
  function unitForm(){
    return `<div class="panel"><span class="eyebrow">New Unit</span>
      <div class="field"><label>Unit name / number</label><input id="f_name" placeholder="e.g. 001"></div>
      <div class="field"><label>Layout</label><div class="chiprow" id="typeChips">
        ${Object.keys(ROOM_TEMPLATES).map(t=>`<button type="button" class="chip ${state.formType===t?'active':''}" data-type="${t}">${t}</button>`).join('')}
      </div></div>
      <div class="checkline"><input type="checkbox" id="f_autorooms" checked><label for="f_autorooms">Auto-create rooms for this layout</label></div>
      ${panelActions('unit')}</div>`;
  }

  // ---------- ROOMS ----------
  function renderRooms(){
    if(!state.selUnit) return emptyState('Select a unit','Choose a unit from the Units tab to see its rooms.',null);
    let out = '';
    if(state.addOpen==='room') out += roomForm();
    const list = roomsOf(state.selUnit).filter(r=>r.name.toLowerCase().includes(state.search.toLowerCase()));
    if(!list.length && !state.addOpen) return out + emptyState('No rooms yet','Add rooms manually, or add this unit again with a layout preset.','room');
    out += list.map(r=>{
      const pct = itemProgress(r.id);
      return `<div class="card" data-select-room="${r.id}">
        <div class="card-top"><div><div class="card-name">${r.name}</div><div class="card-code">${r.code}</div></div>
        <button class="kebab" data-del="room:${r.id}">&times;</button></div>
        <div class="card-progress">${tapeBar(pct)}</div></div>`;
    }).join('');
    return out;
  }
  function roomForm(){
    return `<div class="panel"><span class="eyebrow">New Room</span>
      <div class="field"><label>Room name</label><input id="f_name" placeholder="e.g. Kitchen"></div>
      <div class="field"><label>Room code</label><input id="f_code" placeholder="e.g. KIT"></div>
      ${panelActions('room')}</div>`;
  }

  // ---------- ITEMS ----------
  function renderItems(){
    if(!state.selRoom) return emptyState('Select a room','Choose a room from the Rooms tab to see its checklist.',null);
    let out = '';
    if(state.addOpen==='item') out += itemForm();
    const list = itemsOf(state.selRoom).filter(i=>i.name.toLowerCase().includes(state.search.toLowerCase()));
    if(!state.addOpen){
      out += `<div class="template-row">${ITEM_TEMPLATE.map(t=>`<button class="tbtn" data-quickitem="${t}">+ ${t}</button>`).join('')}</div>`;
    }
    if(!list.length && !state.addOpen) return out + emptyState('No work items yet','Tap a suggestion above or add a custom item.',null);
    out += list.map(it=>{
      const done = it.status==='done';
      const comments = it.comments || [];
      const snags = it.snags || [];
      const openSnags = snags.filter(s=>!s.resolved).length;
      const threadOpen = state.openThread && state.openThread.itemId===it.id;
      let row = `<div class="item-row">
        <button class="stamp ${it.status}" data-cycle="${it.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></button>
        <div class="item-info">
          <div class="item-name ${done?'done-text':''}">${it.name}</div>
          <div class="item-meta">
            <select class="assignee-select" data-assign="${it.id}">
              <option value="">Unassigned</option>
              ${state.data.users.map(u=>`<option value="${u.id}" ${it.assigneeId===u.id?'selected':''}>${u.name}</option>`).join('')}
            </select>
          </div>
          ${it.updatedBy ? `<div class="item-updated">${it.updatedBy} · ${timeAgo(it.updatedAt)}</div>` : ''}
          <div class="item-actions">
            <button class="icon-btn ${threadOpen && state.openThread.type==='comments'?'active':''}" data-toggle-thread="${it.id}:comments">${icon('comment')}<span>Comments${comments.length?` (${comments.length})`:''}</span></button>
            <button class="icon-btn snag-btn ${openSnags>0?'has-snag':''} ${threadOpen && state.openThread.type==='snags'?'active':''}" data-toggle-thread="${it.id}:snags">${icon('flag')}<span>Snag List${snags.length?` (${snags.length})`:''}</span></button>
          </div>
        </div>
        <button class="status-pill ${it.status}" data-cycle="${it.id}">${it.status==='pending'?'Pending':it.status==='progress'?'In Progress':'Done'}</button>
        <button class="del" data-del="item:${it.id}">&times;</button>
      </div>`;
      if(threadOpen) row += threadPanel(it, state.openThread.type);
      return row;
    }).join('');
    return out;
  }
  function threadPanel(it, type){
    const isSnag = type==='snags';
    const list = it[type] || [];
    const entries = list.length ? list.map((c,idx)=>`
      <div class="thread-entry ${isSnag && c.resolved ? 'resolved':''}">
        <div class="thread-entry-top"><span class="log-who">${esc(c.who)}</span><span class="log-time">${timeAgo(c.ts)}</span></div>
        <div class="thread-entry-text">${esc(c.text)}</div>
        ${isSnag ? `<button class="tbtn thread-resolve" data-resolve-snag="${it.id}:${idx}">${c.resolved?'Reopen':'Mark Resolved'}</button>` : ''}
      </div>`).join('') : `<div style="font-size:12px;color:var(--rebar);padding:4px 0 8px;">No ${isSnag?'snags':'comments'} yet.</div>`;
    return `<div class="thread-panel">
      <div class="thread-header"><span class="eyebrow">${isSnag?'Snag List':'Comments'}</span><button class="tbtn" data-close-thread="1">Close</button></div>
      ${entries}
      <div class="thread-input-row">
        <input type="text" class="thread-input" id="thread_input_${it.id}" placeholder="${isSnag?'Describe the issue…':'Add a comment…'}">
        <button class="btn-primary" data-add-thread="${it.id}:${type}">Add</button>
      </div>
    </div>`;
  }
  function itemForm(){
    return `<div class="panel"><span class="eyebrow">New Work Item</span>
      <div class="field"><label>Item name</label><input id="f_name" placeholder="e.g. Tiling"></div>
      ${panelActions('item')}</div>`;
  }

  // ---------- USERS ----------
  function renderUsers(){
    let out = '';
    if(state.addOpen==='user') out += userForm();
    const list = state.data.users.filter(u=>u.name.toLowerCase().includes(state.search.toLowerCase()));
    if(!list.length && !state.addOpen) out += emptyState('No team members yet','Add people so you can assign work items to them.','user');
    else out += list.map(u=>{
      const initials = u.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      return `<div class="user-row"><div class="avatar">${initials}</div>
        <div style="flex:1"><div class="card-name">${u.name}</div><div class="user-role">${u.role||'Team member'}</div></div>
        <button class="kebab" data-del="user:${u.id}">&times;</button></div>`;
    }).join('');
    out += activitySection();
    return out;
  }
  function progressReportRows(){
    if(!state.data.projects.length) return `<div style="font-size:12.5px;color:var(--rebar);padding:6px 0 4px;">No projects yet.</div>`;
    return state.data.projects.map(p=>{
      const pPct = unitProgressAll(p.id);
      const unitsHtml = unitsOf(p.id).map(u=>{
        const uPct = roomProgressAll(u.id);
        const roomsHtml = roomsOf(u.id).map(r=>{
          const items = itemsOf(r.id);
          const done = items.filter(i=>i.status==='done').length;
          const rPct = itemProgress(r.id);
          return `<div class="pr-row pr-room"><span class="pr-label">${r.name}</span><span class="pr-sub">${done}/${items.length} items</span><div class="pr-bar">${tapeBar(rPct)}</div></div>`;
        }).join('');
        return `<div class="pr-row pr-unit"><span class="pr-label">${u.name}</span><div class="pr-bar">${tapeBar(uPct)}</div></div>${roomsHtml}`;
      }).join('');
      return `<div class="pr-row pr-project"><span class="pr-label">${p.name}</span><div class="pr-bar">${tapeBar(pPct)}</div></div>${unitsHtml}`;
    }).join('');
  }
  function csvCell(v){
    const s = String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }
  function buildProgressCSV(){
    const rows = [['Level','Project','Unit','Room','Work Item','Status','Progress %']];
    state.data.projects.forEach(p=>{
      rows.push(['PROJECT', p.name, '', '', '', '', unitProgressAll(p.id)+'%']);
      unitsOf(p.id).forEach(u=>{
        rows.push(['UNIT', p.name, u.name, '', '', '', roomProgressAll(u.id)+'%']);
        roomsOf(u.id).forEach(r=>{
          rows.push(['ROOM', p.name, u.name, r.name, '', '', itemProgress(r.id)+'%']);
          itemsOf(r.id).forEach(it=>{
            const statusLabel = it.status==='done'?'Done':it.status==='progress'?'In Progress':'Pending';
            rows.push(['ITEM', p.name, u.name, r.name, it.name, statusLabel, '']);
          });
        });
      });
    });
    return rows.map(r=>r.map(csvCell).join(',')).join('\n');
  }
  function downloadProgressCSV(){
    const csv = buildProgressCSV();
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `progress-report-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function activitySection(){
    const log = state.data.log || [];
    const hasContent = log.length || state.data.projects.length;
    if(!hasContent) return '';
    if(!state.reportsUnlocked){
      return `<div class="activity-block"><span class="eyebrow">Reports</span>
        ${state.pinOpen ? pinForm() : `<div style="font-size:12.5px;color:var(--rebar);padding:8px 0 10px;">Admin-only: progress report &amp; activity log.</div><button class="tbtn" data-action="open-pin">Enter PIN to view</button>`}
      </div>`;
    }
    if(!state.reportView){
      return `<div class="activity-block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span class="eyebrow" style="margin:0;">Reports</span>
          <button class="tbtn" data-action="lock-reports">Lock reports</button>
        </div>
        <div class="report-icon-row">
          <button class="report-icon-btn" data-action="show-report" data-report="progress">${icon('chart')}<span>Progress Report</span></button>
          <button class="report-icon-btn" data-action="show-report" data-report="activity">${icon('clock')}<span>Activity Log</span></button>
        </div>
      </div>`;
    }
    if(state.reportView==='progress'){
      return `<div class="activity-block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <button class="tbtn" data-action="back-report">&larr; Back</button>
          <div style="display:flex;gap:8px;">
            <button class="tbtn" data-action="download-progress">Download CSV</button>
            <button class="tbtn" data-action="lock-reports">Lock</button>
          </div>
        </div>
        <span class="eyebrow" style="display:block;margin-bottom:8px;">Progress Report</span>
        ${progressReportRows()}
      </div>`;
    }
    const logRows = log.slice(0,20).map(l=>`<div class="log-row-stack"><div class="log-row-top"><span class="log-who">${l.who}</span><span class="log-time">${timeAgo(l.ts)}</span></div><div class="log-action">${l.action}</div></div>`).join('') || `<div style="font-size:12px;color:var(--rebar);padding:6px 0;">No activity yet.</div>`;
    return `<div class="activity-block">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <button class="tbtn" data-action="back-report">&larr; Back</button>
        <button class="tbtn" data-action="lock-reports">Lock</button>
      </div>
      <span class="eyebrow" style="display:block;margin-bottom:8px;">Activity Log</span>
      ${logRows}
    </div>`;
  }
  function pinForm(){
    return `<div style="margin-top:6px;"><input id="f_pin" type="password" inputmode="numeric" placeholder="Enter PIN" style="width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--concrete);font-size:13.5px;margin-bottom:8px;">
      <div class="panel-actions" style="margin-top:0;"><button class="btn-primary" data-action="submit-pin">Unlock</button><button class="btn-ghost" data-action="cancel-pin">Cancel</button></div></div>`;
  }
  function userForm(){
    return `<div class="panel"><span class="eyebrow">New Team Member</span>
      <div class="field"><label>Name</label><input id="f_name" placeholder="e.g. Ramesh Kumar"></div>
      <div class="field"><label>Role</label><input id="f_role" placeholder="e.g. Site Supervisor"></div>
      ${panelActions('user')}</div>`;
  }

  function panelActions(type){
    return `<div class="panel-actions"><button class="btn-primary" data-save="${type}">Save</button><button class="btn-ghost" data-action="cancel-add">Cancel</button></div>`;
  }

  function emptyState(title, sub, addType){
    return `<div class="empty"><div class="disp">${title}</div><div>${sub}</div>${addType?`<button data-action="toggle-add">+ Add</button>`:''}</div>`;
  }

  // ---------- events ----------
  function attachEvents(){
    root.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{ state.tab=b.dataset.nav; state.addOpen=null; state.search=''; state.openThread=null; render(); }));
    root.querySelectorAll('[data-crumb]').forEach((b,i)=>{
      const p = state.data.projects.find(x=>x.id===state.selProject);
      const u = state.data.units.find(x=>x.id===state.selUnit);
      const rm = state.data.rooms.find(x=>x.id===state.selRoom);
      let parts = [];
      if(state.tab!=='projects' && state.tab!=='users') parts.push(()=>{state.tab='projects'; render();});
      if(p && (state.tab==='units'||state.tab==='rooms'||state.tab==='items')) parts.push(()=>{state.tab='units'; render();});
      if(u && (state.tab==='rooms'||state.tab==='items')) parts.push(()=>{state.tab='rooms'; render();});
      if(rm && state.tab==='items') parts.push(null);
      b.addEventListener('click', ()=>{ if(parts[i]) parts[i](); });
    });
    root.querySelectorAll('[data-action="toggle-add"]').forEach(addBtn=>addBtn.addEventListener('click', ()=>{
      const map = {projects:'project', units:'unit', rooms:'room', items:'item', users:'user'};
      state.addOpen = state.addOpen ? null : map[state.tab];
      render();
    }));
    const cancelBtn = root.querySelector('[data-action="cancel-add"]');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.addOpen=null; render(); });
    const whoBtn = root.querySelector('[data-action="switch-identity"]');
    if(whoBtn) whoBtn.addEventListener('click', ()=>{ lsRemove('sc_user_name'); state.currentUser=null; render(); });

    root.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click', ()=>{ state.formType=b.dataset.type; render(); }));

    root.querySelectorAll('[data-select-project]').forEach(c=>c.addEventListener('click', (e)=>{
      if(e.target.closest('.kebab')) return;
      state.selProject=c.dataset.selectProject; state.selUnit=null; state.selRoom=null; state.tab='units'; state.search=''; render();
    }));
    root.querySelectorAll('[data-select-unit]').forEach(c=>c.addEventListener('click', (e)=>{
      if(e.target.closest('.kebab')) return;
      state.selUnit=c.dataset.selectUnit; state.selRoom=null; state.tab='rooms'; state.search=''; render();
    }));
    root.querySelectorAll('[data-select-room]').forEach(c=>c.addEventListener('click', (e)=>{
      if(e.target.closest('.kebab')) return;
      state.selRoom=c.dataset.selectRoom; state.tab='items'; state.search=''; state.openThread=null; render();
    }));

    const searchInput = root.querySelector('#searchInput');
    if(searchInput){
      searchInput.addEventListener('input', ()=>{ state.search = searchInput.value; renderKeepFocus(); });
    }

    root.querySelectorAll('[data-quickitem]').forEach(b=>b.addEventListener('click', ()=>{
      state.data.items.push({id:uid('item'), roomId:state.selRoom, name:b.dataset.quickitem, status:'pending', assigneeId:''});
      logActivity(`added work item "${b.dataset.quickitem}"`);
      save(); render();
    }));

    root.querySelectorAll('[data-cycle]').forEach(b=>b.addEventListener('click', ()=>{
      const it = state.data.items.find(x=>x.id===b.dataset.cycle);
      it.status = it.status==='pending' ? 'progress' : it.status==='progress' ? 'done' : 'pending';
      it.updatedBy = state.currentUser; it.updatedAt = Date.now();
      const label = it.status==='pending'?'Pending':it.status==='progress'?'In Progress':'Done';
      logActivity(`marked "${it.name}" as ${label}`);
      save(); render();
    }));
    root.querySelectorAll('[data-assign]').forEach(sel=>sel.addEventListener('change', ()=>{
      const it = state.data.items.find(x=>x.id===sel.dataset.assign);
      it.assigneeId = sel.value;
      it.updatedBy = state.currentUser; it.updatedAt = Date.now();
      logActivity(`assigned "${it.name}" to ${sel.value ? userName(sel.value) : 'Unassigned'}`);
      save(); render();
    }));

    root.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [type,id] = b.dataset.del.split(':');
      deleteEntity(type,id);
    }));

    const openPinBtn = root.querySelector('[data-action="open-pin"]');
    if(openPinBtn) openPinBtn.addEventListener('click', ()=>{ state.pinOpen=true; render(); });
    const cancelPinBtn = root.querySelector('[data-action="cancel-pin"]');
    if(cancelPinBtn) cancelPinBtn.addEventListener('click', ()=>{ state.pinOpen=false; render(); });
    const submitPinBtn = root.querySelector('[data-action="submit-pin"]');
    if(submitPinBtn) submitPinBtn.addEventListener('click', ()=>{
      const val = root.querySelector('#f_pin').value.trim();
      if(val === ADMIN_PIN){
        lsSet('sc_reports_unlocked','true');
        state.reportsUnlocked = true; state.pinOpen = false;
        toast('Reports unlocked'); render();
      } else { toast('Incorrect PIN'); }
    });
    const lockBtn = root.querySelector('[data-action="lock-reports"]');
    if(lockBtn) lockBtn.addEventListener('click', ()=>{
      lsRemove('sc_reports_unlocked'); state.reportsUnlocked=false; state.reportView=null; render();
    });
    root.querySelectorAll('[data-action="show-report"]').forEach(b=>b.addEventListener('click', ()=>{
      state.reportView = b.dataset.report; render();
    }));
    const backReportBtn = root.querySelector('[data-action="back-report"]');
    if(backReportBtn) backReportBtn.addEventListener('click', ()=>{ state.reportView=null; render(); });
    const downloadBtn = root.querySelector('[data-action="download-progress"]');
    if(downloadBtn) downloadBtn.addEventListener('click', downloadProgressCSV);

    root.querySelectorAll('[data-toggle-thread]').forEach(b=>b.addEventListener('click', ()=>{
      const [itemId, type] = b.dataset.toggleThread.split(':');
      if(state.openThread && state.openThread.itemId===itemId && state.openThread.type===type){
        state.openThread = null;
      } else {
        state.openThread = { itemId, type };
      }
      render();
    }));
    const closeThreadBtn = root.querySelector('[data-close-thread]');
    if(closeThreadBtn) closeThreadBtn.addEventListener('click', ()=>{ state.openThread=null; render(); });
    root.querySelectorAll('[data-add-thread]').forEach(b=>b.addEventListener('click', ()=>{
      const [itemId, type] = b.dataset.addThread.split(':');
      const input = root.querySelector(`#thread_input_${itemId}`);
      const text = input.value.trim();
      if(!text) return toast('Type something first');
      const it = state.data.items.find(x=>x.id===itemId);
      if(!it[type]) it[type] = [];
      const entry = { who: state.currentUser || 'Someone', text, ts: Date.now() };
      if(type==='snags') entry.resolved = false;
      it[type].push(entry);
      logActivity(`${type==='snags'?'logged a snag on':'commented on'} "${it.name}"`);
      save(); render();
    }));
    root.querySelectorAll('[data-resolve-snag]').forEach(b=>b.addEventListener('click', ()=>{
      const [itemId, idx] = b.dataset.resolveSnag.split(':');
      const it = state.data.items.find(x=>x.id===itemId);
      const snag = it.snags[Number(idx)];
      snag.resolved = !snag.resolved;
      logActivity(`${snag.resolved?'resolved':'reopened'} a snag on "${it.name}"`);
      save(); render();
    }));

    const saveBtn = root.querySelector('[data-save]');
    if(saveBtn) saveBtn.addEventListener('click', ()=>submitForm(saveBtn.dataset.save));
  }

  function renderKeepFocus(){
    const activeEl = document.activeElement;
    const wasSearch = activeEl && activeEl.id==='searchInput';
    const caret = wasSearch ? activeEl.selectionStart : null;
    render();
    if(wasSearch){
      const el = root.querySelector('#searchInput');
      if(el){ el.focus(); el.setSelectionRange(caret, caret); }
    }
  }

  function deleteEntity(type,id){
    const lookup = {
      project: state.data.projects.find(x=>x.id===id),
      unit: state.data.units.find(x=>x.id===id),
      room: state.data.rooms.find(x=>x.id===id),
      item: state.data.items.find(x=>x.id===id),
      user: state.data.users.find(x=>x.id===id)
    };
    const entity = lookup[type];
    if(entity) logActivity(`deleted ${type} "${entity.name}"`);
    if(type==='project'){
      const unitIds = unitsOf(id).map(u=>u.id);
      const roomIds = state.data.rooms.filter(r=>unitIds.includes(r.unitId)).map(r=>r.id);
      state.data.items = state.data.items.filter(i=>!roomIds.includes(i.roomId));
      state.data.rooms = state.data.rooms.filter(r=>!unitIds.includes(r.unitId));
      state.data.units = state.data.units.filter(u=>u.projectId!==id);
      state.data.projects = state.data.projects.filter(p=>p.id!==id);
      if(state.selProject===id){ state.selProject=null; state.selUnit=null; state.selRoom=null; }
    } else if(type==='unit'){
      const roomIds = roomsOf(id).map(r=>r.id);
      state.data.items = state.data.items.filter(i=>!roomIds.includes(i.roomId));
      state.data.rooms = state.data.rooms.filter(r=>r.unitId!==id);
      state.data.units = state.data.units.filter(u=>u.id!==id);
      if(state.selUnit===id){ state.selUnit=null; state.selRoom=null; }
    } else if(type==='room'){
      state.data.items = state.data.items.filter(i=>i.roomId!==id);
      state.data.rooms = state.data.rooms.filter(r=>r.id!==id);
      if(state.selRoom===id) state.selRoom=null;
    } else if(type==='item'){
      state.data.items = state.data.items.filter(i=>i.id!==id);
    } else if(type==='user'){
      state.data.users = state.data.users.filter(u=>u.id!==id);
      state.data.items.forEach(i=>{ if(i.assigneeId===id) i.assigneeId=''; });
    }
    save(); render();
  }

  function submitForm(type){
    if(type==='project'){
      const name = root.querySelector('#f_name').value.trim();
      const code = root.querySelector('#f_code').value.trim() || 'P'+(state.data.projects.length+1);
      if(!name) return toast('Enter a project name');
      state.data.projects.push({id:uid('proj'), name, code});
      logActivity(`added project "${name}"`);
    } else if(type==='unit'){
      const name = root.querySelector('#f_name').value.trim();
      if(!name) return toast('Enter a unit name');
      const auto = root.querySelector('#f_autorooms').checked;
      const unitId = uid('unit');
      state.data.units.push({id:unitId, projectId:state.selProject, name, type:state.formType});
      if(auto && ROOM_TEMPLATES[state.formType]){
        ROOM_TEMPLATES[state.formType].forEach(([rname,rcode])=>{
          state.data.rooms.push({id:uid('room'), unitId, name:rname, code:`R-${name}-${rcode}`});
        });
      }
      logActivity(`added unit "${name}"`);
    } else if(type==='room'){
      const name = root.querySelector('#f_name').value.trim();
      const code = root.querySelector('#f_code').value.trim() || name.slice(0,3).toUpperCase();
      if(!name) return toast('Enter a room name');
      const unit = state.data.units.find(u=>u.id===state.selUnit);
      state.data.rooms.push({id:uid('room'), unitId:state.selUnit, name, code:`R-${unit.name}-${code}`});
      logActivity(`added room "${name}"`);
    } else if(type==='item'){
      const name = root.querySelector('#f_name').value.trim();
      if(!name) return toast('Enter an item name');
      state.data.items.push({id:uid('item'), roomId:state.selRoom, name, status:'pending', assigneeId:''});
      logActivity(`added work item "${name}"`);
    } else if(type==='user'){
      const name = root.querySelector('#f_name').value.trim();
      const role = root.querySelector('#f_role').value.trim();
      if(!name) return toast('Enter a name');
      state.data.users.push({id:uid('user'), name, role});
      logActivity(`added team member "${name}"`);
    }
    state.addOpen=null;
    save(); render();
  }

  init();
})();
</script>
